spring:
  datasource:
    url: jdbc:h2:mem:products_api_test
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: true
    open-in-view: false
server:
  error:
    includeStacktrace: never
    include-message: never