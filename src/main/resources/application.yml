server:
  port: 8081
spring:
  output:
    ansi:
      enabled: always
  application:
    name: 'API_apartament'
  datasource:
    url: ${db_url}
    username: ${user}
    password: ${password}
  jpa:
    # show-sql: true
    open-in-view: true
    hibernate:
      ddl-auto: update
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: full
#    properties:
#      jakarta:
#        persistence:
#          schema-generation:
#            scripts:
#              action: create
#              create-target: "src/main/resources/schema.sql"
  web:
    resources:
      add-mappings: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.keycloak.serverUrl}/realms/${app.keycloak.realm}
app:
  keycloak:
    admin:
      clientId: "admin-cli"
      clientSecret: ${client_secret}
    realm: portaria
    serverUrl: http://localhost:9082